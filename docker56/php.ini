; php56 lab settings (mounted into the official php:5.6.40-fpm image)
; Mirrors the php.ini used by the PHP 8.4 lab so the OOM/stale-session
; primitives keep the same trigger conditions:
;   - 1001 multipart fields  -> max_input_vars warning (display_errors=On)
;   - 12MB field             -> OOM inside memory_limit=8M
;   - session.upload_progress-> session starts during rfc1867 parsing
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M

max_input_vars = 1000

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
