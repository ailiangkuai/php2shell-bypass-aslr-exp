; php:5.6.40-fpm 生产参数配置（贴近 php.ini-production 常态）
; 关键配比：memory_limit(128M) > post_max_size(8M)。
; 这个配比让"解析期 OOM（窗口1）"在 main/rfc1867.c:715 的 post_max_size
; 前置检查处就被拦截：攻击 body 一旦超过 post_max_size，multipart 解析
; 根本不会开始，FILE_START/session 预初始化不触发，worker 不会死。
; 翻转这两个数字（memory_limit < post_max_size）即可复现窗口1 可达
; （probe6 会从 200/存活 变为 502/exit 70）。
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M

max_input_vars = 1000
max_input_nesting_level = 64
max_file_uploads = 20

max_execution_time = 30
max_input_time = 60

; 生产常态：错误页不外泄（这会让"靠 fatal 文本判断 OOM"的探针失效，
; 必须改用状态码/worker PID 作为判据）。
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
