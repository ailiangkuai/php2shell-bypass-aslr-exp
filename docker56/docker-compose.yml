services:
  # PHP 5.6.40 + nginx 生产参数靶场。
  # 只走 nginx 入口：FPM 不映射任何端口（生产环境 FPM 从不对外暴露，
  # 只监听容器内网供 nginx fastcgi_pass）。所有测试必须经 nginx 入口，
  # 否则测出来的"可达性"在生产里没有对应路径。
  fpm:
    image: php:5.6.40-fpm
    platform: linux/amd64
    container_name: php56-fpm
    volumes:
      - ./www:/var/www/html:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-prod.ini:ro
      - ./pool.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    platform: linux/amd64
    container_name: php56-nginx
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fpm
    restart: unless-stopped
