services:
  # PHP 5.6.40 FPM target (single worker to mirror the Apache prefork
  # MaxRequestWorkers=1 setup of the original lab).
  fpm:
    image: php:5.6.40-fpm
    platform: linux/amd64
    container_name: php56-fpm
    # Simulated real-world exposure: php-fpm listening on TCP 9000 reachable
    # from outside the container (the classic "0.0.0.0:9000" misconfiguration
    # behind which direct FastCGI attacks like PHP_VALUE injection work).
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - ./www:/var/www/html:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-pwn56.ini:ro
      - ./pool.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ../out56:/out
    # Let the FPM worker (www-data) write the proof file readable on the host.
    command: sh -c "chown -R www-data:www-data /out 2>/dev/null || true; exec php-fpm"
    restart: unless-stopped

  # nginx front-end proxying /index.php to the FPM pool.
  web:
    image: nginx:1.27-alpine
    platform: linux/amd64
    container_name: php56-nginx
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fpm
    restart: unless-stopped
