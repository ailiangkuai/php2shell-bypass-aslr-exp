; php:5.6.40-fpm pool override: exactly ONE worker child, never recycled.
; This is the FPM equivalent of Apache prefork with MaxRequestWorkers=1:
; request A and request B are guaranteed to land on the same process,
; and a crashed child is re-forked by the FPM master with an inherited
; address space (same libphp/fpm mappings -> leaks stay valid).
[www]
user = www-data
group = www-data
listen = 9000
pm = static
pm.max_children = 1
pm.max_requests = 0
request_terminate_timeout = 0
; keep the process env minimal (fpm default), catch_workers_output on so
; PHP warnings/fatals show up in `docker logs php56-fpm`.
catch_workers_output = yes
