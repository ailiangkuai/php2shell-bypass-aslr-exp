; php:5.6.40-fpm 生产形态 pool：多 worker + 定期回收。
; 多 worker 使跨请求的 producer/consumer 难以落在同一进程；max_requests
; 定期回收进一步阻断跨请求残留（窗口2/3 的结构前提被关掉）。
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

request_terminate_timeout = 30s
catch_workers_output = yes
