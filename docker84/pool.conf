; php:8.4.x-fpm pool override: exactly ONE worker child, never recycled.
; Same rationale as Apache prefork MaxRequestWorkers=1: the producer request
; and the consumer request are guaranteed to land on the same worker, and a
; crashed child is re-forked by the FPM master (inherited mappings).
; (The advisory notes the FPM path also works on dynamic pools; the single
;  child only makes the deterministic demo reliable.)
[www]
user = www-data
group = www-data
listen = 9000
pm = static
pm.max_children = 1
pm.max_requests = 0
request_terminate_timeout = 0
catch_workers_output = yes
